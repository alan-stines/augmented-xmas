<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Augmented Xmas</title>
    <meta
      name="description"
      content="Offline camera-to-projector winter scene compositor."
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="Augmented Christmas projector output">
      <video id="camera" playsinline muted></video>
      <canvas id="output"></canvas>

      <section id="startPanel" class="start-panel" aria-live="polite">
        <img
          class="mga-logo"
          src="assets/images/mga-header-logo-horizontal-menu.png"
          alt="Middle Georgia State University"
        />
        <div class="start-copy">
          <p class="eyebrow">Christmas lighting experience</p>
          <h1>Augmented Xmas</h1>
          <p class="credit">
            Built by Department of IT students at Middle Georgia State University
          </p>
        </div>
        <button id="startButton" type="button">Start camera</button>
        <p class="start-hint">
          Use the settings button to tune camera, snow, and head effects.
        </p>
        <p id="status" class="status">Waiting for camera permission.</p>
      </section>

      <nav class="quick-actions" aria-label="Projector quick actions">
        <button id="controlsButton" class="round-button" type="button" aria-label="Show controls">
          &#9881;
        </button>
        <button id="fullscreenButton" class="round-button" type="button" aria-label="Toggle fullscreen">
          &#9974;
        </button>
      </nav>

      <aside id="controls" class="controls" aria-label="Scene controls">
        <header>
          <div>
            <p class="eyebrow">Live controls</p>
            <h2>Winter compositor</h2>
          </div>
          <button id="hideControls" class="icon-button" type="button" title="Hide controls">
            x
          </button>
        </header>

        <div class="preset-grid" aria-label="Scene presets">
          <button type="button" data-preset="clear">Clear</button>
          <button type="button" data-preset="gentle">Gentle</button>
          <button type="button" data-preset="festive">Festive</button>
          <button type="button" data-preset="snowstorm">Snowstorm</button>
        </div>

        <label class="control-row">
          <span>Camera</span>
          <select id="cameraFacingInput">
            <option value="user" selected>Front</option>
            <option value="environment">Rear</option>
          </select>
        </label>

        <label class="control-row">
          <span>Camera detail</span>
          <select id="cameraResolutionInput">
            <option value="hd" selected>HD</option>
            <option value="fullHd">Full HD</option>
          </select>
        </label>

        <label class="control-row">
          <span>Mirror camera</span>
          <input id="mirrorInput" type="checkbox" checked />
        </label>

        <label class="control-row">
          <span>Snow amount</span>
          <input id="snowInput" type="range" min="0" max="1" step="0.01" value="0.42" />
        </label>

        <label class="control-row">
          <span>Night magic</span>
          <input id="gradeInput" type="range" min="0" max="1" step="0.01" value="0.16" />
        </label>

        <label class="control-row">
          <span>Sparkle sensitivity</span>
          <input id="sparkleInput" type="range" min="0" max="1" step="0.01" value="0.38" />
        </label>

        <label class="control-row">
          <span>Light garland</span>
          <input id="lightsInput" type="range" min="0" max="1" step="0.01" value="0.52" />
        </label>

        <label class="control-row">
          <span>Face tracking</span>
          <input id="faceTrackingInput" type="checkbox" checked />
        </label>

        <label class="control-row">
          <span>Head effect</span>
          <select id="faceAccessoryInput">
            <option value="none">None</option>
            <option value="santa" selected>Santa hat</option>
            <option value="elf">Elf hat</option>
            <option value="crown">Sparkle crown</option>
            <option value="reindeer">Reindeer antlers</option>
          </select>
        </label>

        <label class="control-row">
          <span>Show diagnostics</span>
          <input id="debugInput" type="checkbox" />
        </label>
      </aside>

      <div id="debug" class="debug" aria-hidden="true"></div>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
